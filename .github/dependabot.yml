version: 2
updates:
  # Go 모듈 주간 업데이트
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "golang"
    groups:
      go-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # GitHub Actions 워크플로 점검
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
