# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ko-KR
reviews:
  profile: chill
  high_level_summary: true
  poem: false
  review_status: true
  request_changes_workflow: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!go.sum"
    - "!versions.lock.json"
chat:
  auto_reply: true
